# Temporary presentation gateway for the single-VM DRISHTI demo.
# The API and Vite preview remain loopback-only; nginx is the sole public listener.

server {
    listen 80;
    listen [::]:80;
    server_name 34-138-113-181.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 34-138-113-181.sslip.io;

    ssl_certificate /etc/letsencrypt/live/34-138-113-181.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/34-138-113-181.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    auth_basic "DRISHTI presentation";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 300m;

    location /api/jobs/ {
        proxy_pass http://127.0.0.1:8080/api/jobs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        # Vite preview rejects unknown Host values; keep the public URL at nginx while
        # presenting its loopback origin to the already-running preview server.
        proxy_set_header Host 127.0.0.1:4173;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
