name: CI

# Contract tests on every push are the single thing that prevents the H64
# integration disaster (00_GUIDING_MAP.md §R6, 01_DATA_CONTRACTS.md §9).
#
# CI never touches GCP and never sees a sample. Nothing here installs the `lab`
# extra (frida/mitmproxy) and nothing here executes an APK.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Contract tests
        run: uv run pytest tests/contract

      - name: Unit tests
        run: uv run pytest tests/unit

  # Belt and braces on the safety boundary: fail the build if a sample, a key, or
  # a synthetic model artifact ever lands in the tree. The contract test asserts
  # the .gitignore rules; this asserts the actual committed tree.
  no-samples-committed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert no APK / DEX / key / model is tracked
        run: |
          set -euo pipefail
          bad=$(git ls-files \
            | grep -Ei '\.(apk|apks|xapk|dex|joblib|pkl|pem|p12|jks)$' \
            | grep -v '^canary/' || true)
          if [ -n "$bad" ]; then
            echo "::error::Forbidden artifacts are tracked in git:"
            echo "$bad"
            exit 1
          fi
          env_files=$(git ls-files | grep -E '(^|/)\.env$' || true)
          if [ -n "$env_files" ]; then
            echo "::error::A .env file is tracked in git:"
            echo "$env_files"
            exit 1
          fi
          echo "OK: no samples, keys, or model binaries tracked."
