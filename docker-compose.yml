services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DEMO_API_TOKEN: ${DEMO_API_TOKEN:-change-this-demo-token}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      QUARANTINE_DIR: /quarantine
      OBSERVATIONS_DIR: /observations
      TRAINED_MODEL_PATH: ${TRAINED_MODEL_PATH:-}
      ML_MODEL_VERSION: ${ML_MODEL_VERSION:-baseline-synthetic-v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-file:/tmp/mlruns}
    volumes:
      - drishti-quarantine:/quarantine
      - ${OBSERVATIONS_HOST_DIR:-./observations}:/observations:ro
      - ${MODEL_HOST_DIR:-./models}:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  drishti-quarantine:
